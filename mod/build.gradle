plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'com.modrinth.minotaur' version '2.+'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://mvn.devos.one/snapshots' }
    maven { url = 'https://mvn.devos.one/releases' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.tterrag.com/' }
    maven { url = 'https://maven.jamieswhiteshirt.com/libs-release' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modRuntimeOnly "com.simibubi.create:create-fabric-1.20.1:${create_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version,
               minecraft_version: project.minecraft_version,
               loader_version: project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

modrinth {
    token = System.getenv('MODRINTH_TOKEN')
    projectId = project.modrinth_project
    versionNumber = project.mod_version
    versionName = "Create Tweaks ${project.mod_version}"
    versionType = 'release'
    uploadFile = tasks.remapJar
    additionalFiles = [tasks.remapSourcesJar]
    gameVersions = [project.minecraft_version]
    loaders = ['fabric']
    changelog = rootProject.file('../CHANGELOG.md').text
    dependencies {
        required.project 'create-fabric'
        required.project 'fabric-api'
    }
}

tasks.modrinth.dependsOn tasks.build
